name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck
      - name: bash syntax
        run: find . -name '*.sh' -not -path './.git/*' -exec bash -n {} +

  brewfile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse Brewfile
        run: brew bundle list --file=other/Brewfile --all
